<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Thanh Thảo!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background slideshow -->
    <!-- Background music -->
    <audio id="bgMusic" preload="auto" loop autoplay>
        <source src="audio/happy-birthday.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <button id="playMusic" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000; padding: 10px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;">🔇</button>

    <div class="slideshow-container">
        <div class="slide active"></div>
        <div class="slide"></div>
        <div class="slide"></div>
        <div class="slide"></div>
        <div class="slide"></div>
        <div class="overlay"></div>
    </div>

    <!-- Background particles -->
    <div id="particles"></div>

    <!-- Floating balloons -->
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>

    <!-- Main container with horizontal layout -->
    <div class="container">
        <div class="card">
            <!-- Left side - Photo gallery -->
            <div class="left-section">
                <div class="photo-main">
                    <img src="images/1.jpg" alt="Memory 1" id="mainPhoto">
                    <div class="photo-shine"></div>
                </div>
                <div class="photo-thumbnails">
                    <button id="thumbPrev" class="thumb-nav" aria-label="Previous thumbnails">‹</button>
                    <div class="thumbnails-wrapper">
                        <div id="thumbsContainer" class="thumbnails-container">
                            <!-- thumbnails generated by script.js -->
                        </div>
                    </div>
                    <button id="thumbNext" class="thumb-nav" aria-label="Next thumbnails">›</button>
                </div>
            </div>

            <!-- Right side - Birthday content -->
            <div class="right-section">
                <h1 class="title">🎉 Happy Birthday! 🎉</h1>
                
                <h2 class="name-display">Thanh Thảo</h2>
                
                <div class="candles-container">
                    <div class="candle">
                        <div class="glow"></div>
                        <div class="flame"></div>
                    </div>
                    <div class="candle">
                        <div class="glow"></div>
                        <div class="flame"></div>
                    </div>
                    <div class="candle">
                        <div class="glow"></div>
                        <div class="flame"></div>
                    </div>
                    <div class="candle">
                        <div class="glow"></div>
                        <div class="flame"></div>
                    </div>
                    <div class="candle">
                        <div class="glow"></div>
                        <div class="flame"></div>
                    </div>
                </div>

                <p class="message">
                    Chúc mi một ngày sinh nhật thật <strong>đặc biệt</strong>!<br>
                    Tuổi mới sẽ mang đến nhiều<br>
                    <strong>niềm vui</strong>, <strong>sức khỏe</strong> và <strong>thành công</strong>!<br>
                    ✨
                </p>

                <button class="button" onclick="celebrate()">
                    <span>🎊 Thổi nến nào! 🎊</span>
                </button>

                <div class="slideshow-indicator">
                    <span class="dot active" onclick="currentSlide(0)"></span>
                    <span class="dot" onclick="currentSlide(1)"></span>
                    <span class="dot" onclick="currentSlide(2)"></span>
                    <span class="dot" onclick="currentSlide(3)"></span>
                    <span class="dot" onclick="currentSlide(4)"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
